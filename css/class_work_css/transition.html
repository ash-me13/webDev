<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: pink;
            transition: width 2s, height 2s;
            transition-delay: 0.5s;
        }
        #div1{transition-timing-function: liner; background-color: red;}
        #div2{transition-timing-function: ease-in;}
        #div3{transition-timing-function: ease-out;background-color: red;}
        #div4{transition-timing-function: ease-in-out;}
        #div5{transition-timing-function: cubic-bezier(0,0,0,0); background-color: red;}
        div:hover{
            width: 300px;
        }
    </style>
</head>
<body>
    <div id="div1"></div>
    <div id="div2"></div>
    <div id="div3"></div>
    <div id="div4"></div>
    <div id="div5"></div>
</body>
</html>
